name: mktdata_storage

services:
  postgres_mktdata:
    container_name: postgres_mktdata
    image: postgres:17.2
    # change permission of the directory /var/lib/postgresql/data to 0700
    #   - 0700: owner, the postgres user in this case - full permission
    #   - full permission: read, write, execute
    #   - /var/lib/postgresql/data: default directory where postgres stores its data
    command: >
      bash -c "
        mkdir -p ~/Downloads/mktdata_storage &&  # ensure host dir exists (bind mount)
        chown -R 999:999 ~/Downloads/mktdata_storage &&  # set postgresql permissions
        chmod -R 0700 /var/lib/postgresql/data &&  # secure container data dir
        docker-entrypoint.sh postgres
      "
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - PGDATA=/var/lib/postgresql/data
      - POSTGRES_DB=${POSTGRES_DB:-mktdata_collector}
    volumes:
      - ~/Downloads/mktdata_storage:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:rw
    ports:
      - "5432:5432"
    networks:
      - shared_network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  pgadmin_mktdata:
    container_name: pgadmin_mktdata
    image: dpage/pgadmin4:8.14.0
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-admin123}
    ports:
      - "5433:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres_mktdata
    networks:
      - shared_network
    restart: always

networks:
  shared_network:
    driver: bridge
    name: shared_network

volumes:
  postgres_data:
  pgadmin_data:
